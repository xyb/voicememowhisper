[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "voicememowhisper"
version = "0.2.0"
description = "Watch Apple Voice Memos and transcribe recordings with WhisperKit."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Voice Memo Whisper"}]
dependencies = [
    "watchdog>=3.0",
]

[project.optional-dependencies]
# Speaker-ID pipeline (transcribe + diarize + identify + merge + render).
# Heavy ML stack (~2 GB) — opt-in. Without this extra, voicememo-whisper
# falls back to WhisperKit for the bare transcription path.
speaker-id = [
    "faster-whisper>=1.0",
    "pyannote.audio>=4.0",
    "torch",
    "torchaudio",
    "soundfile",
    "numpy",
    # Used by `si viewer`: waveform + spectrogram PNG generation. scipy
    # is already a transitive dep of pyannote.audio so it's not listed.
    "matplotlib",
    # ws-funasr ASR backend: synchronous WebSocket client (~100 KB).
    # stdlib has no WebSocket client, and the async-only alternatives
    # don't fit the rest of the codebase's sync style.
    "websocket-client>=1.0",
]

[project.scripts]
voicememo-whisper = "voicememowhisper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voicememowhisper*"]
